<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAAC</title>
<style>
  :root {
    --bg: #f3f5f8;
    --ink: #14202e;
    --line: #14202e;
    --card: #ffffff;
    --bar: #ffffff;
    --accent: #0b5fff;
    --danger: #c62828;
    --ok: #1b7f3b;
    --radius: 18px;
    --tile-min: 150px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1620;
      --ink: #f1f4f8;
      --line: #f1f4f8;
      --card: #1b2634;
      --bar: #17212e;
      --accent: #6c9dff;
      --danger: #ff8a80;
      --ok: #6fd58f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ---------- Barra de frase ---------- */
  .topbar {
    background: var(--bar);
    border-bottom: 3px solid var(--line);
    padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    display: flex;
    gap: 10px;
    align-items: stretch;
  }
  .phrase {
    flex: 1;
    min-height: 96px;
    display: flex;
    gap: 8px;
    align-items: center;
    overflow-x: auto;
    padding: 6px;
    border: 3px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
  }
  .phrase:empty::before {
    content: "Toca los dibujos para armar la frase";
    opacity: .55;
    font-size: 1.1rem;
    padding: 0 8px;
  }
  .chip {
    flex: 0 0 auto;
    width: 78px;
    height: 84px;
    border: 2px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--card);
  }
  .chip .pic { flex: 0 0 68%; }
  .chip .txt {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: .7rem; font-weight: 800; text-transform: uppercase;
    padding: 0 2px; text-align: center; line-height: 1;
  }

  .controls { display: flex; flex-direction: column; gap: 8px; }
  .controls button, .home-btn {
    font: inherit;
    font-weight: 800;
    font-size: 1rem;
    border: 3px solid var(--line);
    border-radius: 14px;
    padding: 10px 14px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    min-height: 44px;
  }
  .controls .row { display: flex; gap: 8px; flex: 1; }
  .controls .row button { flex: 1; }
  #btn-last  { color: var(--danger); }
  #btn-all   { color: var(--danger); }
  #btn-speak {
    background: var(--ok); color: #fff; border-color: var(--ok);
    font-size: 1.3rem; flex: 1.4;
  }
  [data-dark] #btn-speak { color: #0f1620; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:active:not(:disabled) { transform: scale(.97); }
  button:focus-visible { outline: 4px solid var(--accent); outline-offset: 2px; }

  /* ---------- Navegación ---------- */
  .navbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
  }
  .home-btn { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 1.1rem; }
  @media (prefers-color-scheme: dark) { .home-btn { color: #0f1620; } #btn-speak { color: #0f1620; } }
  #title { font-size: 1.4rem; font-weight: 800; margin: 0; }

  /* ---------- Cuadrícula ---------- */
  main { flex: 1; overflow-y: auto; padding: 4px 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--tile-min), 1fr));
    gap: 12px;
  }
  .tile {
    font: inherit;
    display: flex;
    flex-direction: column;
    aspect-ratio: 1 / 1.1;
    padding: 0;
    overflow: hidden;
    background: var(--card);
    color: var(--ink);
    border: 3px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
  }
  .tile .pic { flex: 0 0 70%; }
  .tile .label {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    padding: 4px 6px;
    font-weight: 800;
    font-size: clamp(.85rem, 2.2vw, 1.15rem);
    text-transform: uppercase;
    line-height: 1.05;
    overflow-wrap: anywhere;
  }
  .pic {
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .pic img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .pic .ph { font-size: 2.2rem; font-weight: 800; color: #14202e; }

  /* Categorías (Home) */
  .cat {
    aspect-ratio: auto;
    min-height: 110px;
    justify-content: center;
    align-items: center;
    background: var(--c);
    border-color: var(--line);
  }
  .cat .label { flex: none; font-size: clamp(1.05rem, 2.8vw, 1.4rem); color: #14202e; padding: 10px; }
  .cat small { font-weight: 600; text-transform: none; display: block; font-size: .8rem; opacity: .8; margin-top: 4px; }

  @media (max-width: 520px) { :root { --tile-min: 112px; } .controls button { font-size: .9rem; padding: 8px; } .chip { width: 64px; height: 72px; } .phrase { min-height: 84px; } }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div id="phrase" class="phrase" aria-live="polite" aria-label="Frase construida"></div>
  <div class="controls">
    <button id="btn-speak" type="button">🔊 Hablar</button>
    <div class="row">
      <button id="btn-last" type="button">⌫ Último</button>
      <button id="btn-all" type="button">✕ Todo</button>
    </div>
  </div>
</header>

<nav class="navbar">
  <button id="btn-home" class="home-btn" type="button">⌂ Volver al inicio</button>
  <h1 id="title">Categorías</h1>
</nav>

<main><div id="grid" class="grid"></div></main>

<script>
/* =====================================================
   CONFIGURACIÓN
   Estructura esperada:
     index.html
     assets/acciones/BEBER.jpg ...
   Si tus archivos tienen otro formato de nombre, ajusta aquí.
   ===================================================== */
const ASSETS_BASE = "assets";   // usa "/assets" si sirves desde la raíz de un servidor
const EXT = ".jpg";
const SPEECH_LANG = "es-US";    // o "es-ES"

/* =====================================================
   DATOS
   Cada ítem: texto (se muestra y se habla) o { label, file, say }
   - file: nombre del archivo sin extensión (por defecto = label)
   - say:  lo que se pronuncia (por defecto = label)
   ===================================================== */
const nums = ["UNO","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE","DIEZ",
              "ONCE","DOCE","TRECE","CATORCE","QUINCE","DIECISÉIS","DIECISIETE","DIECIOCHO","DIECINUEVE","VEINTE"];

const CATEGORIAS = [
  { id: "acciones", nombre: "Acciones", carpeta: "acciones", color: "#ffd9d2",
    items: ["BEBER","COGER","COMER","DORMIR","ESTAR","HACER","IR","JUGAR","PONER","QUITAR","SOLTAR","VENIR"] },
  { id: "alimentos", nombre: "Alimentos", carpeta: "alimentos", color: "#ffe9b8",
    items: ["Arroz","Carne","Chocolate","Chocolatina","Chocorramo","Frijoles","Galletas festival","Hamburguesa","Helado","Huevo","Pan","Papas fritas","Pasta","Perro caliente","Pizza","Sandwich","Sopa","Tomate"] },
  { id: "partes_de_la_casa", nombre: "Partes de la casa", carpeta: "partes_de_la_casa", color: "#d6e8ff",
    items: ["Baño","Casa","Cocina","Comedor","Cuarto de los padres","Cuarto de samuel","Sala"] },
  { id: "colores", nombre: "Colores", carpeta: "colores", color: "#f0d9ff",
    items: ["AMARILLO","AZUL","BLANCO","CAFÉ","GRIS","MORADO","NARANJA","NEGRO","ROJO","ROSADO","VERDE"] },
  { id: "frutas", nombre: "Frutas", carpeta: "frutas", color: "#d9f5d0",
    items: ["Banano","Durazno","Fresa","Mandarina","Manzana roja","Melon","Naranja","Papaya","Pera","Sandia","Uvas"] },
  { id: "jardin", nombre: "Jardín", carpeta: "jardin", color: "#c9f2ea",
    items: ["Aula","Aula 2","Aula cuentos","Jardin","Salon de juegos"] },
  { id: "juguetes", nombre: "Juguetes", carpeta: "juguetes", color: "#ffd6ec",
    items: ["Balon de futbol","Bluey","Buddy","Buzz Lightyear","Cuento","Cuento 2","Huevos sorpresa","Piano","Señor cara de papa"] },
  { id: "lugares", nombre: "Lugares", carpeta: "lugares", color: "#e3e0ff",
    items: ["Centro comercial","Cine","Los juegos","Parque","Zona de comidas"] },
  { id: "numeros", nombre: "Números", carpeta: "numeros", color: "#fff3a8",
    items: nums.map((n, i) => ({ label: String(i + 1), file: String(i + 1), say: n.toLowerCase() })) },
  { id: "pronombres", nombre: "Pronombres", carpeta: "pronombres", color: "#cfe4ff",
    items: ["El","Ella","Nosotros","Tu","Yo"] },
  { id: "ropa", nombre: "Ropa", carpeta: "ropa", color: "#ffddc2",
    items: ["Botines","Camiseta","Chanclas","Pantalon de sudadera","Pantalon de sudadera verde","Pijama"] },
  { id: "vocales", nombre: "Vocales", carpeta: "vocales", color: "#e0f0b8",
    items: ["VOCAL A","VOCAL E","VOCAL I","VOCAL O","VOCAL U"] },
];

/* =====================================================
   ESTADO
   ===================================================== */
const state = {
  categoriaActual: null,  // null = Home
  frase: [],              // [{ label, say, carpeta, file }]
};

/* =====================================================
   VOZ (TTS)
   ===================================================== */
function speakText(text) {
  console.log(text);

  /* --- Descomenta este bloque para activar el audio ---
  if (!("speechSynthesis" in window)) {
    console.warn("Este navegador no soporta speechSynthesis");
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = SPEECH_LANG;   // "es-US" o "es-ES"
  u.rate = 0.9;
  u.pitch = 1;
  const voz = window.speechSynthesis.getVoices().find(v => v.lang.startsWith("es"));
  if (voz) u.voice = voz;
  window.speechSynthesis.speak(u);
  ------------------------------------------------------- */
}

/* =====================================================
   IMÁGENES (con variantes de nombre si falla la carga)
   ===================================================== */
function variantes(nombre) {
  const base = [
    nombre,
    nombre.replace(/ /g, "_"),
    nombre.toLowerCase(),
    nombre.toLowerCase().replace(/ /g, "_"),
  ];
  return [...new Set(base)];
}

function crearImagen(carpeta, archivo, textoRespaldo) {
  const pic = document.createElement("div");
  pic.className = "pic";
  const cand = variantes(archivo).map(v => `${ASSETS_BASE}/${carpeta}/${encodeURIComponent(v)}${EXT}`);
  let i = 0;
  const img = document.createElement("img");
  img.alt = "";
  img.draggable = false;
  img.src = cand[0];
  img.onerror = () => {
    i++;
    if (i < cand.length) { img.src = cand[i]; return; }
    img.remove();
    const ph = document.createElement("span");
    ph.className = "ph";
    ph.textContent = (textoRespaldo || "?").charAt(0).toUpperCase();
    pic.appendChild(ph);
  };
  pic.appendChild(img);
  return pic;
}

/* =====================================================
   RENDER
   ===================================================== */
const $grid = document.getElementById("grid");
const $title = document.getElementById("title");
const $phrase = document.getElementById("phrase");
const $speak = document.getElementById("btn-speak");
const $last = document.getElementById("btn-last");
const $all = document.getElementById("btn-all");

function normalizar(item) {
  if (typeof item === "string") return { label: item, file: item, say: item };
  return { label: item.label, file: item.file ?? item.label, say: item.say ?? item.label };
}

function renderGrid() {
  $grid.innerHTML = "";

  if (state.categoriaActual === null) {
    $title.textContent = "Categorías";
    CATEGORIAS.forEach(cat => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "tile cat";
      b.style.setProperty("--c", cat.color);
      b.innerHTML = `<span class="label">${cat.nombre}</span>`;
      b.addEventListener("click", () => { state.categoriaActual = cat.id; renderGrid(); window.scrollTo(0,0); document.querySelector("main").scrollTop = 0; });
      $grid.appendChild(b);
    });
    return;
  }

  const cat = CATEGORIAS.find(c => c.id === state.categoriaActual);
  $title.textContent = cat.nombre;
  cat.items.map(normalizar).forEach(it => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tile";
    b.setAttribute("aria-label", it.label);
    b.appendChild(crearImagen(cat.carpeta, it.file, it.label));
    const l = document.createElement("span");
    l.className = "label";
    l.textContent = it.label;
    b.appendChild(l);
    b.addEventListener("click", () => agregar({ ...it, carpeta: cat.carpeta }));
    $grid.appendChild(b);
  });
}

function renderFrase() {
  $phrase.innerHTML = "";
  state.frase.forEach(it => {
    const c = document.createElement("div");
    c.className = "chip";
    c.appendChild(crearImagen(it.carpeta, it.file, it.label));
    const t = document.createElement("div");
    t.className = "txt";
    t.textContent = it.label;
    c.appendChild(t);
    $phrase.appendChild(c);
  });
  const vacia = state.frase.length === 0;
  $speak.disabled = $last.disabled = $all.disabled = vacia;
  $phrase.scrollLeft = $phrase.scrollWidth;
}

/* =====================================================
   ACCIONES
   ===================================================== */
function agregar(item) { state.frase.push(item); renderFrase(); }
function borrarUltimo() { state.frase.pop(); renderFrase(); }
function borrarTodo() { state.frase = []; renderFrase(); }
function hablar() {
  if (!state.frase.length) return;
  speakText(state.frase.map(i => i.say.toLowerCase()).join(" "));
}
function irInicio() { state.categoriaActual = null; renderGrid(); }

$speak.addEventListener("click", hablar);
$last.addEventListener("click", borrarUltimo);
$all.addEventListener("click", borrarTodo);
document.getElementById("btn-home").addEventListener("click", irInicio);

renderGrid();
renderFrase();
</script>
</body>
</html>
